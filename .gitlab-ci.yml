image: node:20-bullseye

before_script:
  - apt-get update && apt-get install -y build-essential python3
  - npm install -g pnpm
  - rm -f tsconfig.json
  - cd docs
  - pnpm install

pages:
  tags:
    - docker
    - i6
  script:
    - pnpm run generate
    - cp -r .output/public ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
